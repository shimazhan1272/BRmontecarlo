      // =======================================================================
      // モンテカルロ法 計算ロジック
      // =======================================================================
      function calculateBetUnits(sequence) {
        if (!sequence || sequence.length === 0) return 0;
        if (sequence.length === 1) return Math.max(1, sequence[0]);
        return Math.max(1, sequence[0] + sequence[sequence.length - 1]);
      }

      function calculateBetAmounts(units, unitAmount, points, allocationMode = 'exact') {
        const safePoints = Math.max(1, Math.min(6, points || 1));
        const safeUnit = Math.max(10, unitAmount || 100);
        const targetTotal = units * safeUnit;

        if (safePoints === 1) {
          const perPoint = Math.max(100, Math.ceil(targetTotal / 100) * 100);
          return { targetTotal, perPointAmount: perPoint, actualTotal: perPoint, pointAmounts: [perPoint] };
        }

        if (allocationMode === 'uniform') {
          const rawPerPoint = targetTotal / safePoints;
          const perPoint = Math.max(100, Math.ceil(rawPerPoint / 100) * 100);
          const pointAmounts = Array(safePoints).fill(perPoint);
          const actualTotal = perPoint * safePoints;
          return { targetTotal, perPointAmount: perPoint, actualTotal, pointAmounts };
        }

        // ぴったり配分 (exact)
        const totalHundreds = Math.round(targetTotal / 100);
        const baseHundreds = Math.floor(totalHundreds / safePoints);
        const remainderHundreds = totalHundreds % safePoints;
        const pointAmounts = [];
        for (let i = 0; i < safePoints; i++) {
          const hundreds = baseHundreds + (i < remainderHundreds ? 1 : 0);
          pointAmounts.push(Math.max(100, hundreds * 100));
        }
        const actualTotal = pointAmounts.reduce((sum, val) => sum + val, 0);
        return { targetTotal, perPointAmount: pointAmounts[0], actualTotal, pointAmounts };
      }

      function calculateRequiredOdds(actualTotal, perPointAmount) {
        if (perPointAmount <= 0) return { odds4x: 4.0, odds3x: 3.0, odds2x: 2.0, breakEvenOdds: 1.0 };
        const odds4x = Number(((actualTotal * 4.0) / perPointAmount).toFixed(1));
        const odds3x = Number(((actualTotal * 3.0) / perPointAmount).toFixed(1));
        const odds2x = Number(((actualTotal * 2.0) / perPointAmount).toFixed(1));
        const breakEvenOdds = Number((actualTotal / perPointAmount).toFixed(1));
        return { odds4x, odds3x, odds2x, breakEvenOdds };
      }

      function getNextSequenceOnHit(sequence, currentUnits, recoveryRate, fixedBothEndsMode = false) {
        if (!sequence || sequence.length === 0) {
          return { nextSequence: [], updateAction: 'both_1', eraseCountPerSide: 1, totalErasedCount: 0, ruleTitle: 'クリア', explanation: '完了' };
        }
        if (fixedBothEndsMode) {
          if (sequence.length <= 2) return { nextSequence: [], updateAction: 'both_1', eraseCountPerSide: 1, totalErasedCount: sequence.length, ruleTitle: '両端1個消去', explanation: '完了' };
          return { nextSequence: sequence.slice(1, -1), updateAction: 'both_1', eraseCountPerSide: 1, totalErasedCount: 2, ruleTitle: '両端1個消去', explanation: '両端各1個消去' };
        }

        const odds = recoveryRate;
        const eraseCount = Math.max(0, Math.floor(odds) - 1);

        if (eraseCount >= 1) {
          const eraseTotal = eraseCount * 2;
          if (sequence.length <= eraseTotal) {
            return {
              nextSequence: [],
              updateAction: 'both_dynamic',
              eraseCountPerSide: eraseCount,
              totalErasedCount: sequence.length,
              ruleTitle: `オッズ${odds.toFixed(1)}倍: 左右各${eraseCount}個消去 (サイクル完了)`,
              explanation: `的中時オッズ${odds.toFixed(1)}倍 − 1 ＝ 左右から各${eraseCount}個消去。数字列が全て消えたためサイクル完了！`,
            };
          }
          const nextSequence = sequence.slice(eraseCount, sequence.length - eraseCount);
          return {
            nextSequence,
            updateAction: 'both_dynamic',
            eraseCountPerSide: eraseCount,
            totalErasedCount: eraseTotal,
            ruleTitle: `オッズ${odds.toFixed(1)}倍: 左右各${eraseCount}個消去`,
            explanation: `的中時オッズ${odds.toFixed(1)}倍 − 1 ＝ 左右から各${eraseCount}個消去 (計${eraseTotal}個消去)`,
          };
        }

        if (odds >= 1.0) {
          if (sequence.length <= 1) return { nextSequence: [], updateAction: 'right', eraseCountPerSide: 0, totalErasedCount: 1, ruleTitle: '右端1個消去', explanation: '右端消去' };
          return { nextSequence: sequence.slice(0, -1), updateAction: 'right', eraseCountPerSide: 0, totalErasedCount: 1, ruleTitle: '右端1個消去', explanation: '右端1個消去' };
        }

        return { nextSequence: [...sequence, currentUnits], updateAction: 'add', eraseCountPerSide: 0, totalErasedCount: 0, ruleTitle: '右端に指数追加 (トリガミ)', explanation: `回収率${odds.toFixed(2)}倍 (元本割れ)。右端に+${currentUnits}を追加` };
      }

      function getNextSequenceOnMiss(sequence, currentUnits) {
        return [...sequence, currentUnits];
      }

      const SAMPLE_EXPLANATION_TABLE = [

        { race: 9, before: [4, 5, 8], index: 12, hit: '×', odds: '-', afterVisual: '4・5・8・12', after: [4, 5, 8, 12], bet: 1200, refund: 0, balance: -2300, action: 'miss' },

      const STORAGE_KEY = 'boatrace_montecarlo_v3';

      function App() {
        const [settings, setSettings] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_settings`);
            if (saved) return JSON.parse(saved);
          } catch {}
          return {
            initialSequenceStr: '1, 2, 3',
            unitAmount: 100,
            defaultPoints: 1,
            bankrollLimit: 20000,
            fixedBothEndsMode: false,
            autoRestartOnComplete: true,
            allocationMode: 'exact',
          };
        });

        const initialSeqArray = useMemo(() => {
          return settings.initialSequenceStr
            .split(',')
            .map((s) => parseInt(s.trim(), 10))
            .filter((n) => !isNaN(n) && n > 0);
        }, [settings.initialSequenceStr]);

        const [sequence, setSequence] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_sequence`);
            if (saved) return JSON.parse(saved);
          } catch {}
          return [1, 2, 3];
        });

        const [points, setPoints] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_points`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 1;
        });

        const [cumulativeBalance, setCumulativeBalance] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_cumBalance`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 0;
        });

        const [cycleBalance, setCycleBalance] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_cycleBalance`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 0;
        });

        const [raceCount, setRaceCount] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_raceCount`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 0;
        });

        const [cycleCount, setCycleCount] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_cycleCount`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 1;
        });

        const [lossStreak, setLossStreak] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_lossStreak`);
            if (saved) return parseInt(saved, 10);
          } catch {}
          return 0;
        });

        const [history, setHistory] = useState(() => {
          try {
            const saved = localStorage.getItem(`${STORAGE_KEY}_history`);
            if (saved) return JSON.parse(saved);
          } catch {}
          return [];
        });

        const [undoStack, setUndoStack] = useState([]);
        const [cycleCompletedNotice, setCycleCompletedNotice] = useState(null);

        // モーダル
        const [isHitModalOpen, setIsHitModalOpen] = useState(false);
        const [isSettingsOpen, setIsSettingsOpen] = useState(false);
        const [isHistoryOpen, setIsHistoryOpen] = useState(false);
        const [isExplanationTableOpen, setIsExplanationTableOpen] = useState(false);
        const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);

        // 的中モーダル入力: ユーザー指定仕様「払い戻し金額だけ入力」
        const [hitRefundInput, setHitRefundInput] = useState('1200');

        // 手動買い目配分調整
        const [customPointAmounts, setCustomPointAmounts] = useState(null);

        // 永続化
        useEffect(() => {
          try {
            localStorage.setItem(`${STORAGE_KEY}_settings`, JSON.stringify(settings));
            localStorage.setItem(`${STORAGE_KEY}_sequence`, JSON.stringify(sequence));
            localStorage.setItem(`${STORAGE_KEY}_cumBalance`, String(cumulativeBalance));
            localStorage.setItem(`${STORAGE_KEY}_cycleBalance`, String(cycleBalance));
            localStorage.setItem(`${STORAGE_KEY}_raceCount`, String(raceCount));
            localStorage.setItem(`${STORAGE_KEY}_cycleCount`, String(cycleCount));
            localStorage.setItem(`${STORAGE_KEY}_lossStreak`, String(lossStreak));
            localStorage.setItem(`${STORAGE_KEY}_history`, JSON.stringify(history));
            localStorage.setItem(`${STORAGE_KEY}_points`, String(points));
          } catch {}
        }, [settings, sequence, cumulativeBalance, cycleBalance, raceCount, cycleCount, lossStreak, history, points]);

        // 計算値
        const currentUnits = useMemo(() => calculateBetUnits(sequence), [sequence]);
        const autoAllocation = useMemo(() => {
          return calculateBetAmounts(currentUnits, settings.unitAmount, points, settings.allocationMode || 'exact');
        }, [currentUnits, settings.unitAmount, points, settings.allocationMode]);

        const activePointAmounts = useMemo(() => {
          if (customPointAmounts && customPointAmounts.length === points) return customPointAmounts;
          return autoAllocation.pointAmounts;
        }, [customPointAmounts, points, autoAllocation.pointAmounts]);

        const targetTotal = autoAllocation.targetTotal;
        const actualTotal = useMemo(() => activePointAmounts.reduce((s, v) => s + v, 0), [activePointAmounts]);
        const perPointAmount = activePointAmounts[0] || 100;

        const { odds4x, odds3x, odds2x, breakEvenOdds } = useMemo(() => {
          return calculateRequiredOdds(actualTotal, perPointAmount);
        }, [actualTotal, perPointAmount]);

        const handleAdjustPointAmount = (idx, delta) => {
          const updated = [...activePointAmounts];
          updated[idx] = Math.max(100, (updated[idx] || 100) + delta);
          setCustomPointAmounts(updated);
        };

        const isBankrollWarning = useMemo(() => {
          if (settings.bankrollLimit <= 0) return false;
          return actualTotal >= settings.bankrollLimit || (cumulativeBalance < 0 && Math.abs(cumulativeBalance) + actualTotal >= settings.bankrollLimit);
        }, [actualTotal, cumulativeBalance, settings.bankrollLimit]);

        const saveSnapshot = useCallback(() => {
          const snapshot = {
            sequence: [...sequence],
            cumulativeBalance,
            cycleBalance,
            raceCount,
            cycleCount,
            lossStreak,
            history: [...history],
            cycleCompletedNotice,
          };
          setUndoStack((prev) => [...prev.slice(-30), snapshot]);
        }, [sequence, cumulativeBalance, cycleBalance, raceCount, cycleCount, lossStreak, history, cycleCompletedNotice]);

        const handleUndo = useCallback(() => {
          if (undoStack.length === 0) return;
          const last = undoStack[undoStack.length - 1];
          setSequence(last.sequence);
          setCumulativeBalance(last.cumulativeBalance);
          setCycleBalance(last.cycleBalance);
          setRaceCount(last.raceCount);
          setCycleCount(last.cycleCount);
          setLossStreak(last.lossStreak);
          setHistory(last.history);
          setCycleCompletedNotice(last.cycleCompletedNotice);
          setUndoStack((prev) => prev.slice(0, -1));
        }, [undoStack]);

        // 不的中 (×)
        const handleMiss = useCallback(() => {
          saveSnapshot();
          const nextSeq = getNextSequenceOnMiss(sequence, currentUnits);
          const newRaceCount = raceCount + 1;
          const newCumulative = cumulativeBalance - actualTotal;
          const newCycleBal = cycleBalance - actualTotal;
          const newLossStreak = lossStreak + 1;

          const record = {
            id: `${Date.now()}-${newRaceCount}`,
            raceNumber: newRaceCount,
            cycleNumber: cycleCount,
            sequenceBefore: [...sequence],
            sequenceAfter: nextSeq,
            unitsBet: currentUnits,
            points,
            actualTotal,
            result: 'miss',
            refund: 0,
            balance: -actualTotal,
            recoveryRate: 0,
            updateAction: 'miss',
            eraseCountPerSide: 0,
            cycleCompleted: false,
            timestamp: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          };

          setSequence(nextSeq);
          setRaceCount(newRaceCount);
          setCumulativeBalance(newCumulative);
          setCycleBalance(newCycleBal);
          setLossStreak(newLossStreak);
          setHistory((prev) => [record, ...prev]);
          setCustomPointAmounts(null);
        }, [saveSnapshot, sequence, currentUnits, raceCount, cumulativeBalance, actualTotal, cycleBalance, lossStreak, cycleCount, points]);

        // 的中モーダルを開く (払い戻し金額だけ入力)
        const openHitModal = () => {
          const suggested = Math.max(100, actualTotal * 3);
          setHitRefundInput(String(suggested));
          setIsHitModalOpen(true);
        };

        // 的中試算プレビュー
        const hitPreview = useMemo(() => {
          const refund = Math.max(0, parseInt(hitRefundInput, 10) || 0);
          const balance = refund - actualTotal;
          const recoveryRate = actualTotal > 0 ? Number((refund / actualTotal).toFixed(2)) : 0;
          const { nextSequence, updateAction, eraseCountPerSide, totalErasedCount, ruleTitle, explanation } = getNextSequenceOnHit(sequence, currentUnits, recoveryRate, settings.fixedBothEndsMode);
          const isCycleEnd = nextSequence.length <= 1;
          const nextUnits = isCycleEnd ? calculateBetUnits(initialSeqArray) : calculateBetUnits(nextSequence);
          const nextAmounts = calculateBetAmounts(nextUnits, settings.unitAmount, points, settings.allocationMode || 'exact');

          return {
            refund,
            balance,
            recoveryRate,
            updateAction,
            eraseCountPerSide,
            totalErasedCount,
            ruleTitle,
            explanation,
            nextSequence,
            isCycleEnd,
            nextUnits,
            nextTotal: nextAmounts.actualTotal,
          };
        }, [hitRefundInput, actualTotal, sequence, currentUnits, settings.fixedBothEndsMode, settings.unitAmount, settings.allocationMode, points, initialSeqArray]);

        // 的中確定
        const handleConfirmHit = () => {
          saveSnapshot();
          const { refund, balance, recoveryRate, updateAction, eraseCountPerSide, nextSequence, isCycleEnd } = hitPreview;
          const newRaceCount = raceCount + 1;
          const newCumulative = cumulativeBalance + balance;
          const newCycleBal = cycleBalance + balance;

          const record = {
            id: `${Date.now()}-${newRaceCount}`,
            raceNumber: newRaceCount,
            cycleNumber: cycleCount,
            sequenceBefore: [...sequence],
            sequenceAfter: nextSequence,
            unitsBet: currentUnits,
            points,
            actualTotal,
            result: 'hit',
            refund,
            balance,
            recoveryRate,
            updateAction,
            eraseCountPerSide,
            cycleCompleted: isCycleEnd,
            timestamp: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          };

          setRaceCount(newRaceCount);
          setCumulativeBalance(newCumulative);
          setLossStreak(0);
          setHistory((prev) => [record, ...prev]);
          setIsHitModalOpen(false);

          if (isCycleEnd) {
            setCycleCompletedNotice({ profit: newCycleBal, cycleNum: cycleCount });
            if (settings.autoRestartOnComplete) {
              setSequence(initialSeqArray);
              setCycleCount((c) => c + 1);
              setCycleBalance(0);
            } else {
              setSequence(nextSequence);
            }
          } else {
            setSequence(nextSequence);
            setCycleBalance(newCycleBal);
          }
          setCustomPointAmounts(null);
        };

        const handleStartNextCycle = () => {
          saveSnapshot();
          setSequence(initialSeqArray);
          setCycleCount((c) => c + 1);
          setCycleBalance(0);
          setCycleCompletedNotice(null);
        };

        const handleResetAll = () => {
          saveSnapshot();
          setSequence(initialSeqArray);
          setCumulativeBalance(0);
          setCycleBalance(0);
          setRaceCount(0);
          setCycleCount(1);
          setLossStreak(0);
          setHistory([]);
          setCycleCompletedNotice(null);
          setIsResetConfirmOpen(false);
        };

        const handleExportCSV = () => {
          if (history.length === 0) return;
          const headers = ['レース番号', 'サイクル', '結果', '購入合計(円)', '払戻金(円)', '今回収支(円)', '的中時オッズ', '消去数(片側)', '更新内容', '変化前数列', '変化後数列', '日時'];
          const rows = history.map((r) => [
            r.raceNumber,
            r.cycleNumber,
            r.result === 'hit' ? '的中(○)' : '不的中(×)',
            r.actualTotal,
            r.refund,
            r.balance,
            r.recoveryRate > 0 ? r.recoveryRate.toFixed(2) + '倍' : '-',
            r.eraseCountPerSide || 0,
            r.updateAction === 'both_dynamic' ? `左右各${r.eraseCountPerSide}個消去` : r.updateAction === 'right' ? '右端消去' : r.updateAction === 'add' ? '右端追加' : '不的中追加',
            `"[${r.sequenceBefore.join(', ')}]"`,
            `"[${r.sequenceAfter.join(', ')}]"`,
            r.timestamp,
          ]);
          const csvContent = '\uFEFF' + [headers.join(','), ...rows.map((row) => row.join(','))].join('\r\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const now = new Date();
          const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
          link.setAttribute('href', url);
          link.setAttribute('download', `boatrace_montecarlo_${dateStr}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        return (

                    <div className="text-[11px] text-slate-400 flex items-center justify-between">
                      <span>買い目ごとの配分 (調整可能):</span>
                      {customPointAmounts && (
                        <button

                          onClick={() => setCustomPointAmounts(null)}
                          className="text-[10px] text-cyan-400 hover:underline"
                        >

                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                      {activePointAmounts.map((amt, idx) => (

                          key={idx}
                          className="bg-slate-950 border border-slate-800 rounded-xl p-2 flex items-center justify-between text-xs"
                        >

                          <div className="flex items-center gap-1">
                            <button

                            >

                            <button

                              onClick={() => handleAdjustPointAmount(idx, 100)}

                            >
                              +
                            </button>
                          </div>
                        </div>

                    </div>

                    </div>

                  <div className="font-num font-black text-cyan-400 text-2xl">
                    ¥{actualTotal.toLocaleString()}
                  </div>

                    <div className="text-[8px] text-cyan-400">左右各2個</div>
                  </div>

                <div className="grid grid-cols-4 gap-2 text-center font-num">

                    <div className="text-[10px] text-slate-400">サイクル収支</div>
                    <div className={`font-bold text-sm mt-0.5 ${cycleBalance > 0 ? 'text-emerald-400' : cycleBalance < 0 ? 'text-rose-400' : 'text-slate-300'}`}>
                      {cycleBalance > 0 ? '+' : ''}¥{cycleBalance.toLocaleString()}
                    </div>

                    <div className="text-[10px] text-slate-400">実施レース</div>

              {/* 下部リンク */}

                        className="w-full h-12 bg-slate-950 border border-slate-700 rounded-xl px-3 text-xl font-bold font-num text-white focus:outline-none focus:border-cyan-400"
                      />
                      <span className="absolute right-3 top-3 text-sm text-slate-500">円</span>
                    </div>

                    <div className="flex items-center justify-between text-[11px] text-slate-400 px-0.5 pt-0.5 font-num">
                      <span>今回賭金: <strong className="text-slate-200">¥{actualTotal.toLocaleString()}</strong></span>
                      <span>収支: <strong className={hitPreview.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}>
                        {hitPreview.balance >= 0 ? '+' : ''}¥{hitPreview.balance.toLocaleString()}
                      </strong></span>
                    </div>

                    {/* クイック払戻金ボタン */}
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {[
                        { label: `2倍 (¥${(actualTotal * 2).toLocaleString()})`, val: actualTotal * 2 },
                        { label: `3倍 (¥${(actualTotal * 3).toLocaleString()})`, val: actualTotal * 3 },
                        { label: `4倍 (¥${(actualTotal * 4).toLocaleString()})`, val: actualTotal * 4 },
                        { label: `トントン (¥${actualTotal.toLocaleString()})`, val: actualTotal },
                        { label: '+¥500', add: 500 },
                        { label: '+¥1,000', add: 1000 },
                        { label: '+¥3,000', add: 3000 },
                        { label: '+¥10,000', add: 10000 },
                      ].map((btn, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => {
                            if ('val' in btn) setHitRefundInput(String(btn.val));
                            else if ('add' in btn) {
                              const cur = parseInt(hitRefundInput, 10) || 0;
                              setHitRefundInput(String(Math.max(0, cur + btn.add)));
                            }
                          }}
                          className="px-2 py-1 text-[11px] rounded bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 border border-slate-700 font-medium font-num transition-transform"
                        >
                          {btn.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* リアルタイム消去判定プレビュー */}
                  <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                    <div className="space-y-1">
                      <div className="text-[11px] font-bold text-slate-400 tracking-wider flex items-center justify-between">
                        <span>消去ルール判定</span>
                        <span className="text-[10px] text-cyan-400 font-num">
                          払戻¥{hitPreview.refund.toLocaleString()} ÷ 賭金¥{actualTotal.toLocaleString()} ＝ {hitPreview.recoveryRate.toFixed(2)}倍
                        </span>
                      </div>
                      <div className="text-[11px] font-bold py-1.5 px-2.5 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-between">
                        {hitPreview.eraseCountPerSide >= 1 ? (
                          <span className="text-emerald-400 flex items-center gap-1.5 font-num flex-wrap">
                            <span className="text-xs">🎯 的中時オッズ {hitPreview.recoveryRate.toFixed(1)}倍 − 1 ＝</span>
                            <strong className="text-emerald-300 text-xs">左右から各{hitPreview.eraseCountPerSide}個ずつ消去</strong>
                            <span className="text-[10px] text-slate-400 font-normal">(計{hitPreview.totalErasedCount}個消去)</span>
                          </span>
                        ) : hitPreview.updateAction === 'right' ? (
                          <span className="text-amber-400 font-num text-xs">⚠️ 的中時オッズ 1倍台 ➔ 右端のみ1個消去</span>
                        ) : (
                          <span className="text-rose-400 font-num text-xs">❌ トリガミ (回収率1倍未満) ➔ 右端に指数(+{currentUnits})を追加</span>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 text-center pt-1 border-t border-slate-800 font-num">
                      <div>
                        <div className="text-[10px] text-slate-500">払戻金</div>
                        <div className="font-bold text-emerald-400 text-sm mt-0.5">¥{hitPreview.refund.toLocaleString()}</div>
                      </div>
                      <div>
                        <div className="text-[10px] text-slate-500">今回収支</div>
                        <div className={`font-bold text-sm mt-0.5 ${hitPreview.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {hitPreview.balance >= 0 ? '+' : ''}¥{hitPreview.balance.toLocaleString()}
                        </div>
                      </div>
                      <div>
                        <div className="text-[10px] text-slate-500">的中時オッズ</div>
                        <div className="font-bold text-cyan-300 text-sm mt-0.5">{hitPreview.recoveryRate.toFixed(2)}倍</div>
                      </div>
                    </div>

                    {/* 赤字打ち消し線アニメーションプレビュー */}
                    <div className="pt-2 border-t border-slate-800 space-y-1">
                      <div className="text-[11px] text-slate-400 flex items-center justify-between">
                        <span>消去プレビュー:</span>
                        <span className="text-[10px] text-slate-500 font-num">消去: {hitPreview.totalErasedCount}個</span>
                      </div>
                      <div className="flex flex-wrap items-center gap-1.5 bg-slate-900 px-2.5 py-2 rounded-lg font-num text-xs">
                        {sequence.map((num, idx) => {
                          let isErased = false;
                          if (hitPreview.eraseCountPerSide >= 1) {
                            isErased = idx < hitPreview.eraseCountPerSide || idx >= sequence.length - hitPreview.eraseCountPerSide;
                          } else if (hitPreview.updateAction === 'right') {
                            isErased = idx === sequence.length - 1;
                          }
                          return (
                            <span
                              key={idx}
                              className={`px-1.5 py-0.5 rounded font-bold transition-all ${
                                isErased
                                  ? 'line-through text-rose-400/80 bg-rose-500/10 decoration-rose-500 decoration-2'
                                  : 'text-slate-200 bg-slate-800'
                              }`}
                            >
                              {num}
                            </span>
                          );
                        })}
                        <span className="text-slate-500 mx-1">➔</span>
                        <span className="text-emerald-400 font-bold">
                          {hitPreview.nextSequence.length === 0 ? 'クリア！(サイクル完了)' : `[${hitPreview.nextSequence.join(', ')}]`}
                        </span>
                      </div>
                    </div>

                    <div className="flex items-center justify-between text-xs pt-1">
                      <span className="text-slate-400">次回賭金:</span>
                      <span className="font-num font-bold text-cyan-400">
                        ¥{hitPreview.nextTotal.toLocaleString()} ({hitPreview.nextUnits}単位)
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsHitModalOpen(false)}
                      className="h-11 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs"
                    >
                      戻る
                    </button>
                    <button
                      type="button"
                      onClick={handleConfirmHit}
                      className="h-11 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black text-sm shadow-md"
                    >
                      確定する
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* モンテカルロ法の解説表モーダル */}
            {isExplanationTableOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm">
                <div className="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl p-4 sm:p-5 flex flex-col max-h-[90vh]">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">📋</span>
                      <div>
                        <h3 className="text-base font-bold text-white">モンテカルロ法の解説表 (添付画像準拠)</h3>
                        <p className="text-[11px] text-slate-400">基準100円の10レース推移</p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsExplanationTableOpen(false)}
                      className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="my-3 p-3 bg-amber-950/40 border border-amber-600/50 rounded-xl text-xs text-amber-200">
                    <p className="font-bold text-amber-300">★ 画像の重要消去ルール:</p>
                    <p className="mt-0.5 font-num text-[11px]">
                      <strong>合成オッズ(この場合は3倍) − 1 ＝ 2個数式を消す</strong><br />
                      ・3倍的中: (3 − 1) = <strong>両端から2個ずつ（左2個＋右2個＝計4個）消去！</strong><br />
                      ・2倍的中: (2 − 1) = <strong>両端から1個ずつ（左1個＋右1個＝計2個）消去！</strong>
                    </p>
                  </div>

                  <div className="flex-1 overflow-x-auto overflow-y-auto">
                    <table className="w-full text-[11px] text-left border-collapse font-num">
                      <thead>
                        <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                          <th className="py-2 px-1.5 text-center">レース</th>
                          <th className="py-2 px-1.5">数列</th>
                          <th className="py-2 px-1 text-center">指数</th>
                          <th className="py-2 px-1 text-center">的中</th>
                          <th className="py-2 px-1.5 text-center">合成オッズ</th>
                          <th className="py-2 px-2">終了後の数列</th>
                          <th className="py-2 px-1.5 text-right">賭金</th>
                          <th className="py-2 px-1.5 text-right">払い戻し</th>
                          <th className="py-2 px-2 text-right">収支</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/80">
                        {SAMPLE_EXPLANATION_TABLE.map((row) => (
                          <tr key={row.race} className={`hover:bg-slate-800/50 ${row.hit === '○' ? 'bg-emerald-950/20' : ''}`}>
                            <td className="py-2 px-1.5 text-center font-bold text-slate-300">{row.race}</td>
                            <td className="py-2 px-1.5 text-slate-300">{row.before.join('・')}</td>
                            <td className="py-2 px-1 text-center font-bold text-cyan-400">{row.index}</td>
                            <td className="py-2 px-1 text-center font-bold">{row.hit === '○' ? <span className="text-emerald-400">○</span> : <span className="text-rose-400">×</span>}</td>
                            <td className="py-2 px-1.5 text-center font-bold text-amber-300">{row.odds}</td>
                            <td className="py-2 px-2 text-rose-400 font-semibold">{row.afterVisual}</td>
                            <td className="py-2 px-1.5 text-right text-slate-300">¥{row.bet.toLocaleString()}</td>
                            <td className="py-2 px-1.5 text-right text-emerald-400 font-bold">{row.refund > 0 ? `¥${row.refund.toLocaleString()}` : '-'}</td>
                            <td className={`py-2 px-2 text-right font-bold ${row.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{row.balance >= 0 ? '+' : ''}¥{row.balance.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="pt-3 border-t border-slate-800 flex justify-end">
                    <button
                      type="button"
                      onClick={() => setIsExplanationTableOpen(false)}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold"
                    >
                      閉じる
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 履歴モーダル */}
            {isHistoryOpen && (
              <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-sm">
                <div className="bg-slate-900 border border-slate-700 w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-2xl p-5 space-y-4 max-h-[88vh] flex flex-col">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800 shrink-0">
                    <div className="flex items-center gap-2">
                      <Icon name="history" className="w-5 h-5 text-cyan-400" />
                      <h3 className="text-base font-bold text-white">実践レース履歴 ({history.length}件)</h3>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleExportCSV}
                        disabled={history.length === 0}
                        className="px-3 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 text-white font-bold text-xs flex items-center gap-1 shadow"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>CSV出力</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setIsHistoryOpen(false)}
                        className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                      >
                        <Icon name="x" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                    {history.length === 0 ? (
                      <div className="text-center py-12 text-slate-500 text-xs">
                        まだ履歴がありません。「的中」または「不的中」を押すと自動記録されます。
                      </div>
                    ) : (
                      history.map((record) => (
                        <div key={record.id} className="bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs space-y-1.5">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className={`font-bold px-2 py-0.5 rounded text-[11px] ${record.result === 'hit' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}`}>
                                {record.result === 'hit' ? '的中(○)' : '不的中(×)'}
                              </span>
                              <span className="font-num font-bold text-slate-300">Race #{record.raceNumber}</span>
                              <span className="text-[10px] text-slate-500">(Cycle #{record.cycleNumber})</span>
                            </div>
                            <span className="text-[10px] text-slate-500">{record.timestamp}</span>
                          </div>

                          <div className="grid grid-cols-4 gap-2 text-[11px] font-num pt-1">
                            <div><span className="text-slate-500 block text-[9px]">購入合計</span><span className="text-slate-300">¥{record.actualTotal.toLocaleString()}</span></div>
                            <div><span className="text-slate-500 block text-[9px]">払戻金</span><span className="text-emerald-400">{record.refund > 0 ? `¥${record.refund.toLocaleString()}` : '-'}</span></div>
                            <div><span className="text-slate-500 block text-[9px]">損益</span><span className={`font-bold ${record.balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{record.balance >= 0 ? '+' : ''}¥{record.balance.toLocaleString()}</span></div>
                            <div><span className="text-slate-500 block text-[9px]">的中時オッズ</span><span className="text-cyan-300">{record.recoveryRate > 0 ? `${record.recoveryRate.toFixed(2)}倍` : '-'}</span></div>
                          </div>

                          <div className="pt-1 border-t border-slate-800/80 flex items-center justify-between text-[10px] font-num text-slate-400">
                            <div className="flex items-center gap-1.5">
                              <span>[{record.sequenceBefore.join(', ')}]</span>
                              <span>➔</span>
                              <span className="text-white font-bold">[{record.sequenceAfter.join(', ')}]</span>
                            </div>
                            <span className="text-slate-500">
                              {record.updateAction === 'both_dynamic' ? `左右各${record.eraseCountPerSide}個消去` : record.updateAction === 'right' ? '右端消去' : record.updateAction === 'add' ? '右端追加' : '不的中追加'}
                            </span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 設定モーダル */}
            {isSettingsOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
                <div className="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-4">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                    <div className="flex items-center gap-2">
                      <Icon name="settings" className="w-5 h-5 text-cyan-400" />
                      <h3 className="text-base font-bold text-white">設定</h3>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">初期数字列 (カンマ区切り)</label>
                      <input
                        type="text"
                        value={settings.initialSequenceStr}
                        onChange={(e) => setSettings({ ...settings, initialSequenceStr: e.target.value })}
                        className="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl px-3 font-num text-white"
                        placeholder="例: 1, 2, 3"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">1単位の金額 (円)</label>
                      <input
                        type="number"
                        step="100"
                        value={settings.unitAmount}
                        onChange={(e) => setSettings({ ...settings, unitAmount: Math.max(10, parseInt(e.target.value, 10) || 100) })}
                        className="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl px-3 font-num text-white"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">デフォルト賭け点数 (1〜6点)</label>
                      <input
                        type="number"
                        min="1"
                        max="6"
                        value={settings.defaultPoints}
                        onChange={(e) => setSettings({ ...settings, defaultPoints: Math.max(1, Math.min(6, parseInt(e.target.value, 10) || 1)) })}
                        className="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl px-3 font-num text-white"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 font-bold block mb-1">資金上限アラート (円、0で無効)</label>
                      <input
                        type="number"
                        step="1000"
                        value={settings.bankrollLimit}
                        onChange={(e) => setSettings({ ...settings, bankrollLimit: Math.max(0, parseInt(e.target.value, 10) || 0) })}
                        className="w-full h-10 bg-slate-950 border border-slate-700 rounded-xl px-3 font-num text-white"
                      />
                    </div>
                    <div className="flex items-center justify-between pt-2">
                      <span className="text-slate-300">サイクル完了時に自動で初期数列へ再開</span>
                      <input
                        type="checkbox"
                        checked={settings.autoRestartOnComplete}
                        onChange={(e) => setSettings({ ...settings, autoRestartOnComplete: e.target.checked })}
                        className="w-4 h-4 accent-cyan-500"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex justify-end">
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-xs"
                    >
                      保存して閉じる
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* リセット確認モーダル */}
            {isResetConfirmOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                <div className="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
                  <div className="flex items-center gap-2 text-rose-400">
                    <Icon name="alert" className="w-5 h-5" />
                    <h3 className="text-base font-bold text-white">リセットの確認</h3>
                  </div>
                  <p className="text-xs text-slate-400">
                    現在の数列・収支・連敗数などの進行データを全消去して初期状態に戻しますか？
                  </p>
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsResetConfirmOpen(false)}
                      className="h-10 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs"
                    >
                      キャンセル
                    </button>
                    <button
                      type="button"
                      onClick={handleResetAll}
                      className="h-10 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs"
                    >
                      全てリセット
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
